
<!doctype html><html lang="id"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Visualisasi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script></head>
<body class="bg-light"><main class="container py-4">
<h2 class="mb-3">Visualisasi</h2>
<div class="card p-3 mb-3"><h5>Trend & Prediksi (Regresi Linier dari Matriks)</h5>{{ trend_div|safe }}
  <div class="small text-muted">Persamaan: y = {{ m|round(3) }}x + {{ c|round(3) }}</div></div>
<div class="card p-3 mb-3"><h5>Moving Average</h5>{{ ma_div|safe }}</div>
<div class="card p-3 mb-3"><h5>Regresi Linier (garis pada data saat ini)</h5>{{ reg_div|safe }}
  <div class="small text-muted">Persamaan: y = {{ m2|round(3) }}x + {{ c2|round(3) }}</div></div>
<a class="btn btn-secondary" href="/">Kembali</a>
</main></body></html>
