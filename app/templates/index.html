
<!doctype html><html lang="id"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Zoo Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head><body class="bg-light"><main class="container py-4">
<h1 class="mb-3">Zoo Visitors — Dashboard</h1>
<div class="row g-3">
  <div class="col-md-3"><div class="card p-3"><div class="small text-muted">Baris</div><div class="fs-4 fw-bold">{{ stats.rows }}</div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="small text-muted">Rata-rata</div><div class="fs-4 fw-bold">{{ stats.average_visitors | round(2) }}</div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="small text-muted">Awal</div><div class="fs-6 fw-bold">{{ stats.start_date }}</div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="small text-muted">Akhir</div><div class="fs-6 fw-bold">{{ stats.end_date }}</div></div></div>
</div>
<div class="card mt-4"><div class="card-header">Preview Data</div><div class="card-body">
  <div class="table-responsive"><table class="table table-sm"><thead><tr><th>Tanggal</th><th>Pengunjung</th></tr></thead><tbody>
  {% for row in preview %}<tr><td>{{ row['date'] }}</td><td>{{ row['visitors'] }}</td></tr>{% endfor %}
  </tbody></table></div>
  <a class="btn btn-primary" href="/viz">Lihat Visualisasi</a>
</div></div>
</main></body></html>
